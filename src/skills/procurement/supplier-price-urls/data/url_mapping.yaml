# 权益服务商公开资源页面映射表
# 格式: 权益资源名称 → 服务商名称 → 公开页面 URL
#
# URL 指向的页面包含完整产品信息:
#   - 公开价格或参考成本
#   - 有效期、覆盖范围、使用门槛和服务规则
#   - 爬虫技能可从页面提取上述全部数据
#
# 使用流程:
#   1. MCP 工具获取权益资源名和服务商名
#   2. 查找对应公开页面
#   3. 找到 URL → 抓取公开规则与价格
#   4. 未找到 URL → web_search 搜索公开市场信息

mappings:
  # 演示条目使用保留域名，生产环境由运营人员维护实际公开页面。
  - resource_name: "视频会员月卡"
    provider: "星享数字权益"
    url: "https://example.com/benefits/video-monthly"

  - resource_name: "机场贵宾厅权益"
    provider: "云途生活服务"
    url: "https://example.com/benefits/airport-lounge"

  - resource_name: "连锁咖啡兑换券"
    provider: "惠味餐饮科技"
    url: "https://example.com/benefits/coffee"

  # - resource_name: ""
  #   provider: ""
  #   url: ""
